; Keep your existing working board/platform definitions if different.
[env:firebeetle2_esp32s3]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
lib_deps =
    olikraus/U8g2@^2.36.15
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
